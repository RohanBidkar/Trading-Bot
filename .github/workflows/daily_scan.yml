name: Daily Stock Scan
# Shows which scan each run was in the Actions list.
run-name: ${{ github.event_name == 'schedule' && 'Daily scan' || format('{0} {1}{2}', inputs.scan, inputs.as_of, inputs.month) }}

on:
  schedule:
    # 21:30 UTC, Mon-Fri = 16:30 ET (EDT) / 17:30 ET in winter. GitHub cron is
    # always UTC, so both land after the 4:00pm ET close.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:
    inputs:
      scan:
        description: "Which scan to run"
        type: choice
        default: both
        options:
          - both
          - oversold
          - overbought
          - first5
          - last5
          - bands
          - fxbands
      as_of:
        description: "Scan a past session (YYYY-MM-DD). Blank = latest bar."
        type: string
        required: false
        default: ""
      month:
        description: "first5 only - which month (YYYY-MM). Blank = latest complete window."
        type: string
        required: false
        default: ""
      run_id:
        description: "Website run id the results are filed under. Blank = a new one."
        type: string
        required: false
        default: ""
      telegram:
        description: "Also send to Telegram? The website sends no."
        type: choice
        default: "yes"
        options:
          - "yes"
          - "no"

env:
  # Scheduled runs have no inputs, so default them to "both" / latest bar.
  SCAN: ${{ github.event.inputs.scan || 'both' }}
  AS_OF: ${{ github.event.inputs.as_of || '' }}
  MONTH: ${{ github.event.inputs.month || '' }}
  # Scheduled and hand-started runs get an id of their own on the website.
  RUN_ID: ${{ github.event.inputs.run_id || format('gh-{0}', github.run_id) }}
  SEND_TELEGRAM: ${{ github.event.inputs.telegram == 'no' && '0' || '1' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Where the scanners post their numbers for the website. Both unset = no
    # website, and the scan works exactly as before.
    env:
      RESULTS_URL: ${{ secrets.RESULTS_URL }}
      RESULTS_SECRET: ${{ secrets.RESULTS_SECRET }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Tell the website the run started
        run: python3 report_status.py running

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run oversold scanner
        if: env.SCAN == 'both' || env.SCAN == 'oversold'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # AS_OF is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$AS_OF" ]; then
            python oversold_scanner.py --as-of "$AS_OF" --send
          else
            python oversold_scanner.py
          fi

      - name: Run overbought scanner
        if: env.SCAN == 'both' || env.SCAN == 'overbought'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # AS_OF is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$AS_OF" ]; then
            python overbought_scanner.py --as-of "$AS_OF" --send
          else
            python overbought_scanner.py
          fi

      - name: Run last-trading-days scanner
        # Only on request - it lists every ticker, so it is not part of "both".
        if: env.SCAN == 'last5'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # AS_OF is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$AS_OF" ]; then
            python last_five_scanner.py --as-of "$AS_OF" --send
          else
            python last_five_scanner.py
          fi

      - name: Run SMA20 band levels
        # Only on request - it lists every ticker, so it is not part of "both".
        if: env.SCAN == 'bands'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # AS_OF is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$AS_OF" ]; then
            python sma_band_scanner.py --as-of "$AS_OF" --send
          else
            python sma_band_scanner.py
          fi

      - name: Run forex SMA20 band levels
        # Only on request, like the stock bands.
        if: env.SCAN == 'fxbands'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # AS_OF is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$AS_OF" ]; then
            python sma_band_scanner.py --forex --as-of "$AS_OF" --send
          else
            python sma_band_scanner.py --forex
          fi

      - name: Run first-five-days scanner
        # Only on request - "both" stays the oversold/overbought pair.
        if: env.SCAN == 'first5'
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        # MONTH is passed through the environment and quoted, never
        # interpolated into the shell line, so a hostile input cannot escape.
        run: |
          if [ -n "$MONTH" ]; then
            python first_five_scanner.py --month "$MONTH" --send
          else
            python first_five_scanner.py
          fi

      - name: Tell the website the run finished
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: python3 report_status.py "$JOB_STATUS"
