name: Daily Oversold Scan

on:
  schedule:
    # 21:30 UTC, Mon-Fri = 16:30 ET (EDT) / 17:30 ET is 22:30 UTC in winter.
    # GitHub cron is always UTC, so this runs 4:30pm ET during daylight saving
    # and 5:30pm ET (still after the close) during standard time.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run oversold scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python oversold_scanner.py
